<button
  class="ard-checkbox"
  role="checkbox"
  type="button"
  [attr.id]="htmlId()"
  [attr.name]="htmlName()"
  [attr.aria-checked]="selectedAccountingForReverse()"
  [attr.aria-disabled]="disabled()"
  [attr.aria-labelledby]="label() ? htmlId() + '-label' : null"
  [tabindex]="tabIndex()"
  [ngClass]="ngClasses()"
  (click)="toggleState()"
  (focus)="onFocus($event)"
  (blur)="onBlur($event)"
>
  <div class="ard-hitbox"></div>
  <div class="ard-focus-overlay"></div>

  @if (checkboxIconComponent && !checkboxTemplate()) {
    <!-- render the component -->
    <ng-template
      [ngComponentOutlet]="checkboxIconComponent"
      [ngComponentOutletInputs]="checkboxIconInputs()"
    />
  } @else {
    <ng-template
      #defaultCheckboxTemplate
      let-state="state"
      let-selected="selected"
    >
      <ard-icon
        [icon]="
          state === State.Selected
            ? 'check_box'
            : state === State.Unselected
              ? 'check_box_outline_blank'
              : 'indeterminate_check_box'
        "
        [filled]="state !== State.Indeterminate"
      />
    </ng-template>

    <ng-template
      [ngTemplateOutlet]="
        templateRepository()?.checkboxTmp()?.template ?? checkboxTemplate()?.template ?? defaultCheckboxTemplate
      "
      [ngTemplateOutletContext]="checkboxTemplateContext()"
    />
  }
</button>
@if (label()) {
  <div
    class="ard-checkbox__label"
    (click)="toggleState()"
    [attr.id]="htmlId() + '-label'"
  >
    <div class="ard-checkbox__label-inner">
      @if (labelComponent && !labelTemplate()) {
        <!-- render the component -->
        <ng-template
          [ngComponentOutlet]="labelComponent"
          [ngComponentOutletInputs]="labelComponentInputs()"
        />
      } @else {
        <ng-template
          #defaultLabelTemplate
          let-label
        >
          {{ label }}
        </ng-template>

        <ng-template
          [ngTemplateOutlet]="labelTemplate()?.template ?? defaultLabelTemplate"
          [ngTemplateOutletContext]="labelTemplateContext()"
        />
      }
    </div>
  </div>
}
