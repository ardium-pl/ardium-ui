<button
  #focusableElement
  type="button"
  class="ard-star-button"
  role="checkbox"
  [attr.aria-checked]="valueAccountingForReverse()"
  [attr.aria-disabled]="disabled()"
  [attr.aria-readonly]="readonly()"
  [attr.id]="htmlId()"
  [attr.name]="name()"
  [ngClass]="ngClasses()"
  (click)="onClick()"
  (focus)="onFocus($event)"
  (blur)="onBlur($event)"
  [tabindex]="readonly() ? -1 : tabIndex()"
>
  <div class="ard-hitbox"></div>
  <div class="ard-focus-overlay"></div>

  @if (starIconComponent && !starTemplate()) {
    <!-- render the component -->
    <ng-template
      [ngComponentOutlet]="starIconComponent"
      [ngComponentOutletInputs]="starIconComponentInputs()"
    />
  } @else {
    <ng-template
      #defaultStarTemplate
      let-fillMode="fillMode"
      let-color="color"
    >
      <ard-star
        [filled]="fillMode"
        [color]="color"
      />
    </ng-template>

    <ng-template
      [ngTemplateOutlet]="starTemplate()?.template || defaultStarTemplate"
      [ngTemplateOutletContext]="starTemplateContext()"
    />
  }
</button>
