<div class="flex horiz main-container">
  <div class="master">
    <span class="title">Most basic multipage date range input</span>
    <ard-multipage-date-range-input (valueChange)="log('valueChange', $event)" />
  </div>
  <div class="master">
    <span class="title">Multipage date range input with preselected value</span>
    <ard-multipage-date-range-input [formControl]="formControl" />
  </div>
  <div class="master">
    <span class="title">Multipage date range input with 1 page</span>
    <ard-multipage-date-range-input
      [formControl]="formControl"
      numberOfCalendars="1"
    />
  </div>
  <div class="master">
    <span class="title">Default prefix component</span>
    <app-multipage-date-range-input-default-prefix-component />
  </div>
</div>
