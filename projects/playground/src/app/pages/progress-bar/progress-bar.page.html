<div class="master">
  <span class="title">Default progress bar</span>
  <ard-progress-bar />
</div>
<div class="master">
  <span class="title">Default progress bar with value</span>
  <ard-progress-bar value="50" />
</div>
<div class="master">
  <span class="title">Default progress bar with value animated</span>
  <ard-progress-bar [value]="currentProgress" />
</div>
<div class="master">
  <span class="title">Indeterminate progress bar</span>
  <ard-progress-bar mode="indeterminate" />
</div>
<div class="master">
  <span class="title">Query progress bar</span>
  <ard-progress-bar mode="query" />
</div>
<div class="master">
  <span class="title">Buffer progress bar</span>
  <ard-progress-bar
    mode="buffer"
    color="none"
    value="50"
    bufferValue="60"
  />
</div>
<div class="master">
  <span class="title">Buffer progress bar animated</span>
  <ard-progress-bar
    mode="buffer"
    color="currentColor"
    [value]="currentProgress"
    [bufferValue]="currentBuffer"
  />
</div>
